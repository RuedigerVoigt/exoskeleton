# This workflow runs Unit-Tests for exoskeleton on MacOS
# with the oldest and latest supported Python versions.

name: MacOS Test

on: [push, pull_request]

jobs:
  build:

    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']

    steps:

    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
        pip install pytest_mock pyfakefs

# Some tests currently require a Linux container as MacOS workers
# cannot spin up a MariaDB service. So run a subset.
    - name: Run a subset of the tests
      run: pytest tests/tests_without_side_effects.py
