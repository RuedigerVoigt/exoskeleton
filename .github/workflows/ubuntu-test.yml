# This workflow runs tests on Ubuntu with all supported Python versions
# using a MariaDB service container

name: Ubuntu Test

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    services:
      mariadb:
        image: mariadb:latest
        ports:
          - 12345:3306
        env:
          MYSQL_ROOT_PASSWORD: 'RootPassphrase' # password for root account
          MYSQL_DATABASE: 'exoskeleton_test' # database to be created on image startup
          MYSQL_USER: 'exoskeleton_test' # User with all rights for exoskeleton_test database
          MYSQL_PASSWORD: 'exoskeleton_test' # Password for the exoskeleton_test user

    steps:

    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
        pip install pytest_mock pyfakefs

    - name: Install Chromium
      run: sudo apt install chromium-browser

    # The next step need to wait until the MariaDB container is ready.
    # This pings it until it gets an answer:
    - name: Wait for MariaDB to initialize
      run: |
        while ! mysqladmin ping -h"127.0.0.1" -P"12345" --silent; do
          sleep 1
        done

    # All stored procedures migrated to Python/ORM - no SQL file to load
    # Tables will be auto-created by SQLAlchemy from models.py
    # Schema version and reference data will be auto-initialized by database_schema_check.py

    - name: Make a directory to store downloads
      run: mkdir ./fileDownloads

    - name: Run tests without side-effects
      run: pytest tests/tests_without_side_effects.py

    - name: Run system-test with pytest
      env:
        # Explicit test database configuration
        TEST_DB_HOST: '127.0.0.1'
        TEST_DB_PORT: '12345'
        TEST_DB_NAME: 'exoskeleton_test'
        TEST_DB_USER: 'exoskeleton_test'
        TEST_DB_PASSWORD: 'exoskeleton_test'
        TEST_BROWSER: 'chromium-browser'
      run: pytest tests/tests_with_side_effects.py

    - name: Run network integration tests with pytest
      env:
        TEST_DB_HOST: '127.0.0.1'
        TEST_DB_PORT: '12345'
        TEST_DB_NAME: 'exoskeleton_test'
        TEST_DB_USER: 'exoskeleton_test'
        TEST_DB_PASSWORD: 'exoskeleton_test'
      run: pytest tests/tests_network.py

    - name: List downloaded files
      run: ls -l ./fileDownloads
