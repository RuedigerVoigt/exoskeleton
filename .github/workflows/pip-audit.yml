# This workflow audits the project's dependencies for known
# vulnerabilities (CVEs) using pip-audit.

name: pip-audit (dependency CVE scan)

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    # Run once a day at 06:00 UTC to catch CVEs disclosed after merge.
    - cron: '0 6 * * *'

# Principle of least privilege: the audit only needs to read the repository.
permissions:
  contents: read

jobs:
  pip-audit:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']

    steps:

    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install project and dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Audit installed dependencies for known vulnerabilities
      uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
      with:
        # Audit the environment the project was just installed into,
        # rather than a requirements file (this project uses Poetry).
        local: true
