version: 2
updates:
  # Keep GitHub Actions current. Because the workflows pin actions to full
  # commit SHAs (with the version as a trailing comment), Dependabot bumps
  # both the SHA and the comment when a new release is published.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Collapse all action bumps into a single PR to reduce noise.
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep Python dependencies current. The "pip" ecosystem understands
  # Poetry's pyproject.toml and updates the lock file alongside it.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
