[tool.poetry]
name = "exoskeleton"
version = "3.0.0"
description = "A library to create a bot / spider / crawler."
authors = ["Rüdiger Voigt <projects@ruediger-voigt.eu>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/RuedigerVoigt/exoskeleton"
repository = "https://github.com/RuedigerVoigt/exoskeleton"
keywords = ["crawler", "scraper", "spider", "bot", "web-scraping"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
packages = [{include = "exoskeleton"}]
include = ["exoskeleton/py.typed"]

[tool.poetry.urls]
"Homepage" = "https://github.com/RuedigerVoigt/exoskeleton"
"Repository" = "https://github.com/RuedigerVoigt/exoskeleton"
"Bug Tracker" = "https://github.com/RuedigerVoigt/exoskeleton/issues"
"Documentation" = "https://github.com/RuedigerVoigt/exoskeleton/tree/master/documentation"
"Changelog" = "https://github.com/RuedigerVoigt/exoskeleton/blob/master/CHANGELOG.md"

[tool.poetry.dependencies]
python = "^3.12"
beautifulsoup4 = ">=4.15.0"
bote = ">=1.2.2"
compatibility = ">=2.2.0"
lxml = ">=6.1.1"
pymysql = ">=1.2.0"
python-dotenv = ">=1.2.2"
pydantic = ">=2.13.4"
requests = ">=2.34.2"
urllib3 = ">=2.7.0"
userprovided = ">=2.5.0"
SQLAlchemy = ">=2.0.51"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-timeout = "^2.4.0"
coverage = "^7.15.0"
flake8 = "^7.3.0"
mypy = "^2.1.0"
bandit = "^1.9.4"
types-requests = "^2.33.0.20260518"
pyfakefs = "^6.2.0"
pytest-mock = "^3.15.1"

[project]
name = "exoskeleton"
version = "3.0.0"
description = "A library to create a bot / spider / crawler."
authors = [{name = "Rüdiger Voigt", email = "projects@ruediger-voigt.eu"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12"
keywords = ["crawler", "scraper", "spider", "bot", "web-scraping"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bote>=1.2.2",
    "compatibility>=2.2.0",
    "lxml>=6.1.1",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
    "userprovided>=2.5.0",
    "SQLAlchemy>=2.0.51",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "coverage>=7.15.0",
    "flake8>=7.3.0",
    "mypy>=2.1.0",
    "bandit>=1.9.4",
    "types-requests>=2.33.0.20260518",
    "pyfakefs>=6.2.0",
    "pytest-mock>=3.15.1",
]

[project.urls]
Homepage = "https://github.com/RuedigerVoigt/exoskeleton"
Repository = "https://github.com/RuedigerVoigt/exoskeleton"
"Bug Tracker" = "https://github.com/RuedigerVoigt/exoskeleton/issues"
Documentation = "https://github.com/RuedigerVoigt/exoskeleton/tree/master/documentation"
Changelog = "https://github.com/RuedigerVoigt/exoskeleton/blob/master/CHANGELOG.md"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
console_output_style = "classic"
testpaths = ["tests"]
python_files = ["tests_*.py"]
timeout = 120

[tool.coverage.run]
branch = true
cover_pylib = false
source = ["exoskeleton"]

[tool.coverage.html]
title = "Coverage Report for the Exoskeleton Python Package"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
